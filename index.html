<!DOCTYPE html>
<!-- 本工作台：宇天408·运营工作台（单文件HTML + localStorage）。零外部依赖，全内联CSS/JS/SVG。 -->
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>宇天408 · 运营工作台</title>
<style>
  :root{
    --bg:#FDF9EE; --panel:#ffffff; --ink:#56565B; --muted:#97979C; --line:#E6E4DA;
    --brand:#B6C2CF; --brand-d:#7C8997; --brand-l:#DBDDDA;
    --official:#B6C2CF; --self:#97979C; --parttime:#8C99A8;
    --ok:#5d7d4f; --warn:#b4543f; --soft:#EEF0ED;
    --r:14px; --sh:0 1px 3px rgba(60,50,40,.08),0 6px 18px rgba(60,50,40,.07);
  }
  /* ===== 别人的链接（guest）专属配色：E7ADA2 / E4DED4 / 7A857C / 5E6462 / F6FFF4 ===== */
  body.guest{
    --bg:#F6F7F4; --panel:#ffffff; --ink:#5E6462; --muted:#7A857C; --line:#E4DED4;
    --brand:#B7ADA2; --brand-d:#7A857C; --brand-l:#E4DED4;
    --official:#B7ADA2; --self:#7A857C; --parttime:#5E6462;
    --ok:#7A857C; --warn:#B7ADA2; --soft:#E4DED4;
  }
  body.guest .topbar{background:rgba(246,247,244,.92)}
  body.guest .tag.official{background:#EBE4DD;color:#6B5E54;border-left:3px solid #B7ADA2}
  body.guest .tag.self{background:#E0E4E1;color:#4A524B;border-left:3px solid #7A857C}
  body.guest .tag.parttime{background:#E5E5E3;color:#3F4341;border-left:3px solid #5E6462}
  body.guest .tag.gray{background:#E4DED4;color:#7A857C}
  body.guest .tag.green{background:#E0E4E1;color:#4A524B}
  body.guest .tag.red{background:#EBE4DD;color:#6B5E54}
  body.guest .tag.blue{background:#EBE4DD;color:#6B5E54}
  body.guest .st-idea{background:#E4DED4;color:#5E6462}
  body.guest .st-writing{background:#EBE4DD;color:#6B5E54}
  body.guest .st-review{background:#E0E4E1;color:#4A524B}
  body.guest .st-published{background:#E8EDE6;color:#4A524B}
  body.guest .focus{background:linear-gradient(135deg,#F6F7F4,#E4DED4);border:1px solid #E4DED4;color:#5E6462}
  body.guest .focus h3{color:#7A857C}
  body.guest .pub-summary{background:#E4DED4;border:1px solid #B7ADA2;color:#5E6462}
  body.guest .pub-summary b{color:#7A857C}
  body.guest th{background:#F6F7F4}
  body.guest tr:hover td{background:#F6F7F4}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",sans-serif;
    background:var(--bg);color:var(--ink);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
  button{font-family:inherit}
  .app{display:flex;min-height:100vh}
  /* 侧边栏 */
  .nav{width:218px;flex:none;background:var(--panel);border-right:1px solid var(--line);
    display:flex;flex-direction:column;position:sticky;top:0;height:100vh;z-index:30}
  .nav .logo{padding:18px 18px 10px;font-weight:800;font-size:17px;letter-spacing:.3px;color:var(--brand-d)}
  .nav .logo small{display:block;font-weight:500;font-size:11px;color:var(--muted);margin-top:2px}
  .nav .menu{padding:8px;overflow:auto;flex:1}
  .nav .item{display:flex;align-items:center;gap:10px;padding:11px 12px;border-radius:11px;color:var(--muted);
    cursor:pointer;font-weight:600;font-size:14px;margin-bottom:3px;user-select:none}
  .nav .item svg{width:19px;height:19px;flex:none}
  .nav .item:hover{background:var(--brand-l);color:var(--brand-d)}
  .nav .item.active{background:var(--brand);color:#fff}
  .nav .item.active svg{stroke:#fff}
  .nav .foot{padding:12px;border-top:1px solid var(--line);font-size:11px;color:var(--muted);line-height:1.5}
  /* 主体 */
  .main{flex:1;min-width:0;display:flex;flex-direction:column}
  .topbar{position:sticky;top:0;z-index:20;background:rgba(244,246,251,.92);backdrop-filter:blur(8px);
    border-bottom:1px solid var(--line);padding:12px 20px;display:flex;align-items:center;gap:12px}
  .topbar h1{font-size:18px;margin:0;font-weight:800}
  .topbar .sub{color:var(--muted);font-size:12.5px;margin-top:1px}
  .topbar .spacer{flex:1}
  .topbar .pill{background:var(--brand-l);color:var(--brand-d);border-radius:999px;padding:6px 12px;font-weight:700;font-size:12.5px}
  .hamburger{display:none;width:42px;height:42px;border:none;background:var(--brand);color:#fff;border-radius:11px;cursor:pointer}
  .wrap{padding:18px 20px 40px;max-width:1180px;width:100%;margin:0 auto}
  /* 通用卡片 */
  .card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh);padding:16px 16px}
  .card h3{margin:0 0 12px;font-size:14.5px;font-weight:800;display:flex;align-items:center;gap:8px}
  .card h3 svg{width:18px;height:18px;stroke:var(--brand)}
  .grid{display:grid;gap:14px}
  .g2{grid-template-columns:repeat(2,1fr)}
  .g3{grid-template-columns:repeat(3,1fr)}
  .g4{grid-template-columns:repeat(4,1fr)}
  @media(max-width:920px){.g3,.g4{grid-template-columns:repeat(2,1fr)}}
  @media(max-width:620px){.g2,.g3,.g4{grid-template-columns:1fr}}
  /* 统计块 */
  .stat{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh);padding:14px 15px}
  .stat .k{font-size:12px;color:var(--muted);font-weight:600}
  .stat .v{font-size:24px;font-weight:800;margin-top:4px;letter-spacing:.3px}
  .stat .x{font-size:12px;color:var(--muted);margin-top:2px}
  .stat.official{border-left:4px solid var(--official)} .stat.official .v{color:var(--official)}
  /* 引流批量录入 */
  .tr-grid{display:flex;flex-direction:column;gap:4px;margin-top:4px}
  .tr-row{display:flex;align-items:center;gap:10px;padding:6px 2px;border-bottom:1px dashed var(--line)}
  .tr-row:last-child{border-bottom:none}
  .tr-row .tr-name{flex:1;font-size:13px}
  .tr-row input[type=number]{width:120px;text-align:right}
  .stat.self{border-left:4px solid var(--self)} .stat.self .v{color:var(--self)}
  .stat.parttime{border-left:4px solid var(--parttime)} .stat.parttime .v{color:var(--parttime)}
  .stat.total{border-left:4px solid var(--brand)} .stat.total .v{color:var(--brand-d)}
  .stat.ok{border-left:4px solid var(--ok)} .stat.ok .v{color:var(--ok)}
  .smini{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:9px 12px;flex:1;min-width:120px}
  .smini .k{font-size:12px;color:var(--muted);font-weight:600}
  .smini .v{font-size:20px;font-weight:800;margin-top:3px;font-variant-numeric:tabular-nums}
  .smini .x{font-size:11px;color:var(--muted);margin-top:1px}
  /* 统一下拉筛选框：柔和风格 + 主题配色 */
  select{font-family:inherit;font-size:13.5px;color:var(--ink);background:#fff;
    border:1px solid var(--line);border-radius:10px;padding:8px 30px 8px 12px;
    -webkit-appearance:none;appearance:none;cursor:pointer;transition:.15s;
    background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);
    background-position:calc(100% - 16px) calc(50% - 1px),calc(100% - 11px) calc(50% - 1px);
    background-size:5px 5px,5px 5px;background-repeat:no-repeat}
  select:hover{border-color:var(--brand)}
  select:focus{outline:none;border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-l)}
  .filterbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px}
  .fl{display:inline-flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted);font-weight:600}
  .fl select,.filterbar select,.row select,.body select{width:auto;min-width:140px;max-width:240px}
  .filterbar .dim{display:flex;gap:6px}
  /* 按钮 */
  .btn{border:none;border-radius:11px;padding:10px 15px;font-weight:700;font-size:13.5px;cursor:pointer;
    background:var(--brand);color:#fff;min-height:42px;display:inline-flex;align-items:center;gap:6px}
  .btn:hover{background:var(--brand-d)}
  .btn.ghost{background:#fff;color:var(--ink);border:1px solid var(--line)}
  .btn.ghost:hover{background:var(--brand-l)}
  .btn.ghost.active{background:var(--brand);color:#fff;border-color:var(--brand)}
  .btn.ghost.active:hover{background:var(--brand-d);border-color:var(--brand-d)}
  .btn.sm{padding:7px 11px;font-size:12.5px;min-height:36px;border-radius:9px}
  .btn.danger{background:#fff;color:var(--warn);border:1px solid #f3c4c4}
  .btn.danger:hover{background:#fff1f1}
  .btn svg{width:15px;height:15px;stroke:currentColor}
  .row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
  .mt{margin-top:14px}.mb{margin-bottom:14px}
  /* 标签/徽章 */
  .tag{display:inline-flex;align-items:center;gap:4px;padding:3px 9px;border-radius:999px;font-size:11.5px;font-weight:700}
  .tag.official{background:#DCE3EA;color:#5C6B7A;border-left:3px solid #B6C2CF}
  .tag.self{background:#ECECEE;color:#6B6B70;border-left:3px solid #97979C}
  .tag.parttime{background:#E7EAE7;color:#6E7A70;border-left:3px solid #8C99A8}
  .tag.gray{background:#EEF0ED;color:var(--muted)}
  .tag.inactive{opacity:0.5;text-decoration:line-through}
  .tag.green{background:#e7f0e0;color:var(--ok)}
  .tag.red{background:#f6e6e1;color:var(--warn)}
  .tag.blue{background:var(--brand-l);color:var(--brand-d)}
  .badge{font-size:11px;font-weight:700;padding:2px 8px;border-radius:6px}
  .st-idea{background:#eef1f6;color:#475569}
  .st-writing{background:#fef3e2;color:#b45309}
  .st-review{background:#e6f6fe;color:#0369a1}
  .st-published{background:#e7f7ec;color:var(--ok)}
  /* 列表/表格 */
  .list{display:flex;flex-direction:column;gap:10px}
  .li{background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:flex;gap:12px;align-items:flex-start}
  .li .body{flex:1;min-width:0}
  .li .t{font-weight:700;font-size:14.5px;margin:0 0 3px}
  .li .m{color:var(--muted);font-size:12.5px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .li .m a{color:var(--brand-d);text-decoration:underline}
  .li .acts{display:flex;gap:6px;flex:none}
  table{width:100%;border-collapse:collapse;font-size:13px}
  th,td{padding:9px 10px;text-align:left;border-bottom:1px solid var(--line)}
  th{color:var(--muted);font-weight:700;font-size:12px;background:#fafbfe}
  tr:hover td{background:#fafcff}
  .num{font-variant-numeric:tabular-nums;font-weight:700}
  /* 表单/弹窗 */
  .mask{position:fixed;inset:0;background:rgba(16,24,40,.42);display:none;align-items:center;justify-content:center;z-index:60;padding:16px}
  .mask.show{display:flex}
  .modal{background:#fff;border-radius:16px;width:min(540px,100%);max-height:88vh;overflow:auto;box-shadow:0 20px 60px rgba(10,20,40,.25);padding:20px}
  .modal h3{margin:0 0 14px;font-size:16px;font-weight:800}
  .field{margin-bottom:12px}
  .field label{display:block;font-size:12.5px;font-weight:700;color:var(--muted);margin-bottom:5px}
  .field input,.field select,.field textarea{width:100%;padding:10px 30px 10px 11px;border:1px solid var(--line);border-radius:10px;font-size:15px;font-family:inherit;background:#fff;color:var(--ink)}
  .field textarea{resize:vertical;min-height:64px}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}
  .mini{padding:7px 30px 7px 11px;border:1px solid var(--line);border-radius:9px;font-size:13px;background:#fff url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='10' height='6'><path d='M0 0l5 6 5-6z' fill='%2397979C'/></svg>") no-repeat right 11px center;color:var(--ink);font-family:inherit;appearance:none;-webkit-appearance:none;cursor:pointer;transition:border-color .15s,box-shadow .15s}
  .mini:focus{outline:none;border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-l)}
  .pub-summary{background:var(--brand-l);border:1px solid #E3E7F2;border-radius:10px;padding:9px 12px;font-size:12.5px;color:#3a4252;margin-bottom:12px}
  .pub-summary b{color:var(--brand-d)}
  .li .m.stats{font-size:12px;margin-top:2px}
  .field input:focus,.field select:focus,.field textarea:focus{outline:none;border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-l)}
  .seg{display:flex;gap:6px;flex-wrap:wrap}
  .seg label{display:inline-flex;padding:8px 12px;border:1px solid var(--line);border-radius:9px;font-size:13px;font-weight:600;cursor:pointer;background:#fff}
  .seg input{display:none}
  .seg input:checked + span{color:var(--brand-d)}
  .seg label:has(input:checked){border-color:var(--brand);background:var(--brand-l)}
  /* 今日待处理 */
  .focus{background:linear-gradient(135deg,#FDF9EE,#F2EFE6);border:1px solid #E6E4DA;border-radius:var(--r);padding:14px 16px;margin-bottom:16px}
  .focus h3{margin:0 0 10px;font-size:14.5px;display:flex;align-items:center;gap:8px;color:var(--brand-d)}
  .focus h3 svg{width:18px;height:18px;flex:none;stroke:var(--brand-d)}
  .focus .fi{display:flex;align-items:center;gap:10px;padding:8px 10px;background:#fff;border:1px solid var(--line);border-radius:10px;margin-bottom:8px}
  .focus .fi:last-child{margin-bottom:0}
  .focus .fi .ic{width:30px;height:30px;border-radius:8px;background:var(--brand-l);display:flex;align-items:center;justify-content:center;flex:none}
  .focus .fi .ic svg{width:16px;height:16px;stroke:var(--brand)}
  .focus .fi .tx{flex:1;font-size:13px}
  .focus .fi .tx b{color:var(--warn)}
  /* 进度条 */
  .bar{height:8px;background:#EEF0ED;border-radius:99px;overflow:hidden}
  .bar > i{display:block;height:100%;background:var(--brand);border-radius:99px}
  /* 移动端 */
  @media(max-width:820px){
    .nav{position:fixed;left:0;top:0;transform:translateX(-100%);transition:.25s;box-shadow:0 0 40px rgba(0,0,0,.2)}
    .nav.show{transform:translateX(0)}
    .hamburger{display:inline-flex;align-items:center;justify-content:center}
    .scrim{position:fixed;inset:0;background:rgba(0,0,0,.3);z-index:25;display:none}
    .scrim.show{display:block}
    .wrap{padding:14px 13px 60px}
    .topbar{padding:10px 13px}
    .topbar h1{font-size:16px}
  }
  .bottombar{display:none}
  @media(max-width:820px){
    .bottombar{display:flex;position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--line);
      z-index:40;padding:6px 4px calc(6px + env(safe-area-inset-bottom));justify-content:space-around}
    .bottombar .bi{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;color:var(--muted);font-size:10.5px;font-weight:700;cursor:pointer;padding:4px 0}
    .bottombar .bi svg{width:21px;height:21px;stroke:currentColor}
    .bottombar .bi.active{color:var(--brand)}
    .wrap{padding-bottom:74px}
  }
  .toast{position:fixed;left:50%;bottom:80px;transform:translateX(-50%);background:#56565B;color:#fff;padding:11px 18px;border-radius:11px;font-size:13.5px;font-weight:600;z-index:80;opacity:0;transition:.25s;pointer-events:none;max-width:90vw}
  .toast.show{opacity:1}
  .muted{color:var(--muted)} .small{font-size:12.5px}
  .chartbox{width:100%;overflow:hidden}
  .empty{text-align:center;color:var(--muted);padding:26px 10px;font-size:13.5px}
  .sub-head{margin:16px 2px 8px;color:var(--muted);font-size:12.5px;font-weight:700;letter-spacing:.3px}
  .pub-tip{margin:0 0 10px;padding:8px 11px;background:#F7F6F2;border:1px dashed var(--line);border-radius:9px;font-size:12.5px;color:var(--ink);line-height:1.55}
  .pub-tip .tag{margin-left:2px;margin-right:2px;font-size:11px}
  .tabbar{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
  .tabbar .tab{padding:9px 14px;border-radius:10px;font-weight:700;font-size:13px;cursor:pointer;background:#fff;border:1px solid var(--line);color:var(--muted)}
  .tabbar .tab.active{background:var(--brand);color:#fff;border-color:var(--brand)}
  .split{display:flex;gap:14px;flex-wrap:wrap}
  .split > .col{flex:1;min-width:260px}
  .kv{display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px dashed var(--line);font-size:13px}
  .kv:last-child{border-bottom:none}
  .kv b{font-variant-numeric:tabular-nums}
  /* 热力图 */
  .heat{display:flex;flex-wrap:wrap;gap:6px;padding:2px}
  .heat .cell{min-width:54px;padding:7px 9px;border-radius:9px;font-size:11px;line-height:1.3;text-align:center;background:#F0E9ED;color:var(--ink);flex:none;position:relative}
  .heat .cell b{display:block;font-size:15px;font-variant-numeric:tabular-nums}
  .heat .h0{background:#F4F1EA}
  .heat .h1{background:#DBDDDA}
  .heat .h2{background:#B6C2CF}
  .heat .h3{background:#7C8997;color:#fff}
  .heat .h4{background:#56565B;color:#fff}
  .heat .cell[data-t]:hover::after{content:attr(data-t);position:absolute;left:50%;top:-22px;transform:translateX(-50%);background:#56565B;color:#fff;font-size:10px;padding:2px 6px;border-radius:5px;white-space:nowrap;z-index:5}
  .heat-legend{display:flex;align-items:center;gap:5px;font-size:11px;color:var(--muted);margin-top:6px}
  .heat-legend i{width:13px;height:13px;border-radius:3px;display:inline-block}
</style>
</head>
<body>
<div class="app">
  <aside class="nav" id="nav">
    <div class="logo">宇天408<small id="brandSub"></small></div>
    <div class="menu" id="menu"></div>
    <div class="foot">单文件 · 本地存储<br>数据自动存浏览器<br>不展示报班转化率</div>
  </aside>
  <div class="scrim" id="scrim"></div>
  <div class="main">
    <div class="topbar">
      <button class="hamburger" id="ham" aria-label="菜单">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
      </button>
      <div>
        <h1 id="pageTitle">驾驶舱</h1>
        <div class="sub" id="pageSub"></div>
      </div>
      <div class="spacer"></div>
      <div class="pill" id="periodPill">周期 —</div>
    </div>
    <div class="wrap" id="view"></div>
  </div>
  <nav class="bottombar" id="bottombar"></nav>
</div>
<div class="mask" id="mask"><div class="modal" id="modal"></div></div>
<div class="toast" id="toast"></div>

<script>
(function(){
  "use strict";
  var IS_GUEST = /[?&](guest|demo|blank)\b/i.test(location.search || '');
  var KEY = IS_GUEST ? "wb_yutian_ops_guest_v1" : "wb_yutian_ops_v1";
  document.body.className = IS_GUEST ? 'guest' : '';
  var APP = {};

  /* ---------- 图标 ---------- */
  function svg(p){return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">'+p+'</svg>';}
  var I = {
    dash: svg('<path d="M3 13h8V3H3zM13 21h8V11h-8zM13 3v6h8V3zM3 21h8v-6H3z"/>'),
    content: svg('<path d="M4 5h16M4 12h16M4 19h10"/>'),
    traffic: svg('<path d="M3 17l5-5 4 3 8-8"/><path d="M21 7v5h-5"/>'),
    group: svg('<circle cx="9" cy="8" r="3.2"/><path d="M3.5 19a5.5 5.5 0 0 1 11 0"/><path d="M16 6a3 3 0 0 1 0 6M21 19a5 5 0 0 0-4-4.9"/>'),
    material: svg('<path d="M4 4h11l5 5v11H4z"/><path d="M15 4v5h5"/>'),
    backup: svg('<path d="M12 4v10m0 0l-4-4m4 4l4-4"/><path d="M4 17v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-2"/>'),
    plus: svg('<path d="M12 5v14M5 12h14"/>'),
    edit: svg('<path d="M4 20h4L19 9l-4-4L4 16z"/>'),
    trash: svg('<path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13"/>'),

  function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
  function fmtDate(d){d=new Date(d);if(isNaN(d))return d;var m=('0'+(d.getMonth()+1)).slice(-2),day=('0'+d.getDate()).slice(-2);return d.getFullYear()+'-'+m+'-'+day;}
  function today(){return fmtDate(new Date());}
  function parseCount(v){
    if(v==null)return 0;
    v=String(v).trim().toLowerCase();
    if(!v)return 0;
    var mul=1;
    if(v.slice(-1)==='w'){mul=10000;v=v.slice(0,-1);}
    else if(v.slice(-1)==='k'){mul=1000;v=v.slice(0,-1);}
    else if(v.slice(-1)==='万'){mul=10000;v=v.slice(0,-1);}
    else if(v.slice(-1)==='千'){mul=1000;v=v.slice(0,-1);}
    var n=parseFloat(v);
    if(isNaN(n))return 0;
    return Math.round(n*mul);
  }
  function formatCount(n){
    n=Number(n)||0;
    if(n>=10000){var w=n/10000;return (Math.round(w*10)/10)+'w';}
    if(n>=1000){var k=n/1000;return (Math.round(k*10)/10)+'k';}
    return String(n);
  }
  function extractUrls(text){
    if(!text)return [];
    var re=/https?:\/\/[^\s<>"{}|\\^`\[\]]+/gi,m,out=[];
    while((m=re.exec(text))!==null){out.push(m[0]);}
    return out;
  }
  function copyText(text){
    if(navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(text).then(function(){toast('已复制');}).catch(function(){fallbackCopy(text);});
    }else{fallbackCopy(text);}
    function fallbackCopy(t){
      var ta=document.createElement('textarea');ta.value=t;ta.style.position='fixed';ta.style.opacity='0';document.body.appendChild(ta);ta.select();
      try{document.execCommand('copy');toast('已复制');}catch(e){toast('复制失败');}
      document.body.removeChild(ta);
    }
  }

  /* ---------- 业绩考核积分引擎 ---------- */
  function accById(id){var a=APP.data.accounts;for(var i=0;i<a.length;i++)if(a[i].id===id)return a[i];return null;}
  function typeLabel(t){if(t&&typeof t==='object')return t.cat||(t.type==='official'?'官方号':(t.type==='self'?'自营号':'兼职号'));var x=t;return x==='official'?'官方号':(x==='self'?'自营号':'兼职号');}
  function convertOwnerOf(name){
    var m=String(name||'').match(/(\d+)\D*$/);
    if(!m)return '—';
    var n=parseInt(m[1],10);
    return (n%2===1)?'宇天派哥':'宇天希哥';
  }
  // 单条记录的"引流数"：官号=加好友，自营/兼职=进群
  function recNum(rec){var a=accById(rec.accountId);if(!a)return 0;return a.type==='official'?(Number(rec.addFriend)||0):(Number(rec.join)||0);}
  function scoreOf(rec){var a=accById(rec.accountId);if(!a)return 0;return recNum(rec)*a.rate;}
  // 某类账号的倍率显示文案：同倍率显示 ×N；异构则显示"按账号倍率"（分数计算始终按各账号真实倍率）
  function rateLabelOf(type){
    var accs=APP.data.accounts.filter(function(a){return a.type===type;});
    if(!accs.length)return '按账号倍率';
    var rs=accs.map(function(a){return Number(a.rate||1);});
    var allSame=rs.every(function(r){return r===rs[0];});
    return allSame?('×'+rs[0]):'按账号倍率';
  }
  function getPeriod(pid){return APP.data.periods.filter(function(x){return x.id===pid;})[0];}
  // 当前统计月度 key（YYYY-MM，跟随 today）：每月5号~次月5号为一个统计月度
  function currentMonthKey(){return pidToMonthKey(pidOf(today()));}
  // 当前统计月度对应的 period id（today 落在哪个 5号~次月5号 区间）
  function currentMonthPid(){
    var t=today();
    var cps=APP.data.periods.filter(function(p){return t>=p.start && t<p.end;});
    if(cps.length)return cps[0].id;
    return APP.data.meta.currentPeriod;
  }
  // 月度 key（YYYY-MM）→ period id（按该月5号起算的月度周期）
  function monthKeyToPid(mk){
    var m=parseInt(mk.substring(5,7),10);
    return 'p_'+pad2(m)+'05';
  }
  // period id（p_MM05）→ 月度 key（YYYY-MM），年份取自该周期起始日（保证下拉与筛选同一套周期逻辑）
  function pidToMonthKey(pid){
    var mm=parseInt(pid.substring(2,4),10);
    var p=getPeriod(pid);
    var yr=p?parseInt(p.start.substring(0,4),10):2026;
    return yr+'-'+pad2(mm);
  }
  // 该记录是否落在某考核周期内（按 cstart 起始日判断）
  function inPeriod(r,p){if(!p)return false;var c=r.cstart||cycleStart(r.cycle);return c>=p.start&&c<p.end;}
  function periodRecs(pid){var p=getPeriod(pid);return APP.data.traffic.filter(function(r){return inPeriod(r,p);});}
  // 按当前周期汇总三类引流 + 分数
  function periodScore(pid){
    var recs=periodRecs(pid);
    var off={join:0,score:0},self={join:0,score:0},pt={join:0,score:0};
    recs.forEach(function(r){
      var a=accById(r.accountId); if(!a)return;
      var j=recNum(r);
      if(a.type==='official'){off.join+=j;off.score+=j*a.rate;}
      else if(a.type==='self'){self.join+=j;self.score+=j*a.rate;}
      else {pt.join+=j;pt.score+=j*a.rate;}
    });
    return {off:rd(off),self:rd(self),pt:rd(pt),total:Math.round(off.score+self.score+pt.score),
      addFriend:recs.reduce(function(s,r){return s+(Number(r.addFriend)||0);},0)};
    function rd(o){o.score=Math.round(o.score);return o;}
  }
  // 兼职小计（周期内所有兼职号进群合计）
  function parttimeSubtotal(pid){
    return periodRecs(pid).filter(function(r){var a=accById(r.accountId);return a&&a.type==='parttime';})
      .reduce(function(s,r){return s+(Number(r.join)||0);},0);
  }
  // 全部月度汇总（明细选「全部月度」时）
  function allTimeScore(){
    var off={join:0,score:0},self={join:0,score:0},pt={join:0,score:0};
    APP.data.traffic.forEach(function(r){
      var a=accById(r.accountId);if(!a)return;var j=recNum(r);
      if(a.type==='official'){off.join+=j;off.score+=j*a.rate;}
      else if(a.type==='self'){self.join+=j;self.score+=j*a.rate;}
      else {pt.join+=j;pt.score+=j*a.rate;}
    });
    return {off:rd(off),self:rd(self),pt:rd(pt),total:Math.round(off.score+self.score+pt.score),
      addFriend:APP.data.traffic.reduce(function(s,r){return s+(Number(r.addFriend)||0);},0)};
    function rd(o){o.score=Math.round(o.score);return o;}
  }
  // 从任意记录数组计算三类分数（用于日历月份筛选后的统计）
  function scoreFromRecs(recs){
    var off={join:0,score:0},self={join:0,score:0},pt={join:0,score:0};
    recs.forEach(function(r){
      var a=accById(r.accountId); if(!a)return; var j=recNum(r);
      if(a.type==='official'){off.join+=j;off.score+=j*a.rate;}
      else if(a.type==='self'){self.join+=j;self.score+=j*a.rate;}
      else {pt.join+=j;pt.score+=j*a.rate;}
    });
    return {off:rd(off),self:rd(self),pt:rd(pt),total:Math.round(off.score+self.score+pt.score),
      addFriend:recs.reduce(function(s,r){return s+(Number(r.addFriend)||0);},0)};
    function rd(o){o.score=Math.round(o.score);return o;}
  }
  // 解析统计周期标签的起始日（用于周期归属与排序）。'8.5-8.9'->2026-08-05；也兼容完整日期
  function cycleStart(cycle){
    var s=String(cycle||'').trim();
    var full=s.match(/(\d{4})-(\d{1,2})-(\d{1,2})/);
    if(full)return full[1]+'-'+pad2(+full[2])+'-'+pad2(+full[3]);
    var m=s.match(/(\d{1,2})\.(\d{1,2})/);
    if(m)return '2026-'+pad2(+m[1])+'-'+pad2(+m[2]);
    return today();
  }

  // 选题库每周自动补充：从 TOPIC_POOL 按顺序放出若干条（默认每周3条），按最近一次自动补充时间控制节奏
  function topicAutoRelease(force){
    if(!APP.data.topicAuto)APP.data.topicAuto={last:'',idx:0};
    var ta=APP.data.topicAuto, pool=IS_GUEST?GUEST_TOPIC_POOL:TOPIC_POOL, N=IS_GUEST?5:3;
    if(ta.idx>=pool.length)return {added:0,total:pool.length,remain:0,done:true};
    var due=force||!ta.last||(daysBetween(ta.last,today())>=7);
    if(!due)return {added:0,total:pool.length,remain:pool.length-ta.idx,done:false};
    var added=0;
    while(added<N&&ta.idx<pool.length){
      var s=pool[ta.idx++];
      APP.data.topics.unshift({id:uid(),title:s.title,angle:s.angle,subject:s.subject,stage:s.stage,pain:s.pain,forAccount:'',status:'idea',audience:s.audience||'27',note:'（每周自动补充）',createdAt:today()});
      added++;
    }
    ta.last=today();
    save();
    return {added:added,total:pool.length,remain:pool.length-ta.idx,done:ta.idx>=pool.length};
  }

  function syncReviewFromPublish(p){

  function pubList(){
    var all=APP.data.publishes.slice();

      if(APP.state.pubRange!=='all'&&ymOf(p.date)!==APP.state.pubRange)return false;
      if(APP.state.pubHot&&!(isHotPost(p)&&!isHighViewPost(p)))return false;
      if(APP.state.pubHighView&&!isHighViewPost(p))return false;
      return true;
    });
    var s=APP.state.pubSort;
    all.sort(function(a,b){
      if(s==='like_desc')return (Number(b.like||0))-(Number(a.like||0));
      if(s==='fav_desc')return (Number(b.fav||0))-(Number(a.fav||0));
      if(s==='view_desc')return (Number(b.view||0))-(Number(a.view||0));
      var ta=parseDate(a.date).getTime(),tb=parseDate(b.date).getTime();
      if(ta!==tb)return tb-ta;
      return String(b.id||'').localeCompare(String(a.id||''));
    });

  /* ---------- 引流数据 + 业绩 ---------- */
  function pad2(n){return (n<10?'0':'')+n;}
  // 完整日期 -> 月.日（如 2026-08-05 -> 8.5），用于周期标签
  function formatMD(iso){var p=String(iso||'').split('-');if(p.length<3)return iso;return (parseInt(p[1],10))+'.'+(parseInt(p[2],10));}
  function fmtDate(d){return d.getFullYear()+'-'+pad2(d.getMonth()+1)+'-'+pad2(d.getDate());}
  // 所有统计周期（按起始日排序），每周期跨账号引流合计
  function cycleList(){
    var map={};
    APP.data.traffic.forEach(function(r){
      var k=r.cycle||'-';
      if(!map[k])map[k]={label:k,cstart:r.cstart||cycleStart(k),total:0};
      map[k].total+=recNum(r);
    });
    var arr=Object.keys(map).map(function(k){return map[k];});
    arr.sort(function(a,b){return a.cstart<b.cstart?-1:1;});
    return arr;
  }
  function heatData(range){
    var cycles=cycleList();
    if(range==='week'){
      // 跟随当前选中的统计月度（tfMonth），取该月度内的每周数据
      var mKey=APP.state.tfMonth||currentMonthKey();
      var mPid=(mKey==='all')?APP.data.meta.currentPeriod:monthKeyToPid(mKey);
      var p=getPeriod(mPid);
      var inP=cycles.filter(function(c){return inPeriod({cstart:c.cstart},p);});
      return {cells:inP,label:'本月度各周'};
    }
    if(range==='month'){
      var mm={};
      cycles.forEach(function(c){var k=c.cstart.substring(0,7);if(!mm[k])mm[k]={label:k,total:0,cstart:c.cstart};mm[k].total+=c.total;});
      var arr=Object.keys(mm).map(function(k){return mm[k];});
      arr.sort(function(a,b){return a.cstart<b.cstart?-1:1;});
      return {cells:arr,label:'按月聚合'};
    }
    return {cells:cycles,label:'全部周期'}; // 全部
  }
  function renderHeat(){
    var hd=heatData(APP.state.heatRange);
    var max=Math.max(1,Math.max.apply(null,hd.cells.map(function(c){return c.total;}).concat([0])));
    var sum=hd.cells.reduce(function(s,c){return s+c.total;},0);
    var ranges=[['week','本月度各周'],['month','按月'],['all','全部']];
    var tabs=ranges.map(function(r){return '<button class="btn sm ghost'+(APP.state.heatRange===r[0]?' active':'')+'" data-heat="'+r[0]+'">'+r[1]+'</button>';}).join(' ');
    var cells=hd.cells.map(function(c){
      var lvl=c.total===0?0:Math.max(1,Math.ceil(c.total/max*4));
      return '<div class="heat cell h'+lvl+'" data-t="'+esc(c.label)+'：引流 '+c.total+' 人">'+esc(c.label)+'<b>'+c.total+'</b></div>';
    }).join('');
    if(!cells)cells='<div class="muted small">暂无引流数据</div>';
    return '<div class="card mb"><div class="row mb" style="justify-content:space-between"><h3 style="margin:0">'+I.traffic+'引流热力图</h3>'+
      '<div class="row" style="gap:6px">'+tabs+'</div></div>'+
      '<div class="heat">'+cells+'</div>'+
      '<div class="heat-legend">少 <i class="h0" style="background:#F4F1EA"></i><i class="h1" style="background:#DBDDDA"></i><i class="h2" style="background:#B6C2CF"></i><i class="h3" style="background:#7C8997"></i><i class="h4" style="background:#56565B"></i> 多</div>'+

  /* ---------- 引流图表 ---------- */
  // 趋势折线图：按周展示官方号/自营号/兼职号的引流数据
  function renderTrafficTrendChart(monthFiltered){
    var W=540,H=300,pad={t:34,r:24,b:80,l:48};
    var iw=W-pad.l-pad.r,ih=H-pad.t-pad.b;
    // 按周聚合，分三类
    var weeks={};monthFiltered.forEach(function(r){
      var c=r.cycle||'?';if(!weeks[c])weeks[c]={off:0,self:0,pt:0,cstart:r.cstart||cycleStart(r.cycle)};
      var a=accById(r.accountId);
      if(a&&a.type==='official')weeks[c].off+=Number(r.addFriend||0);
      else if(a&&a.type==='self')weeks[c].self+=Number(r.join||0);
      else weeks[c].pt+=Number(r.join||0);
    });
    var wkList=Object.keys(weeks).sort(function(a,b){return (weeks[a].cstart||'')<(weeks[b].cstart||'')?-1:1;});
    if(!wkList.length)wkList=['(暂无)'];weeks['(暂无)']={off:0,self:0,pt:0,cstart:''};
    var allVals=[];wkList.forEach(function(w){allVals.push(weeks[w].off,weeks[w].self,weeks[w].pt);});
    var maxV=Math.max(5,Math.max.apply(null,allVals));
    var sx=function(i){return pad.l+i*(iw/Math.max(1,wkList.length-1));};
    var sy=function(v){return pad.t+ih-(v/maxV*ih);};
    var dots=wkList.map(function(w,i){
      var x=sx(wkList.length===1?0.5:i),o=weeks[w].off,s=weeks[w].self,p=weeks[w].pt;
      return '<circle cx="'+x+'" cy="'+sy(o)+'" r="3.5" fill="#B6C2CF"/>'+
        '<circle cx="'+x+'" cy="'+sy(s)+'" r="3.5" fill="#97979C"/>'+
        '<circle cx="'+x+'" cy="'+sy(p)+'" r="3.5" fill="#8C99A8"/>';
    }).join('');
    var lines='';
    if(wkList.length>1){
      var pOff=wkList.map(function(w,i){return (sx(i)+','+sy(weeks[w].off));}).join(' ');
      var pSelf=wkList.map(function(w,i){return (sx(i)+','+sy(weeks[w].self));}).join(' ');
      var pPt=wkList.map(function(w,i){return (sx(i)+','+sy(weeks[w].pt));}).join(' ');
      lines='<polyline points="'+pOff+'" fill="none" stroke="#B6C2CF" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>'+
        '<polyline points="'+pSelf+'" fill="none" stroke="#97979C" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>'+
        '<polyline points="'+pPt+'" fill="none" stroke="#8C99A8" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>';
    }
    // X轴标签：倾斜放置，避免与图例/其他文字重叠
    var xLabels=wkList.map(function(w,i){
      var x=sx(wkList.length===1?0.5:i);
      var ly=H-pad.b+16;
      return '<text x="'+x+'" y="'+ly+'" text-anchor="end" font-size="10" fill="#97979C" transform="rotate(32,'+x+','+ly+')">'+esc(w)+'</text>';
    }).join('');
    // Y轴网格线 + 标签
    var yGrid='',yLabels='';
    for(var i=0;i<=4;i++){
      var v=Math.round(maxV*i/4),y=sy(v);
      yGrid+='<line x1="'+pad.l+'" y1="'+y+'" x2="'+(W-pad.r)+'" y2="'+y+'" stroke="#EEF0ED" stroke-width="1"/>';
      yLabels+='<text x="'+(pad.l-6)+'" y="'+(y+4)+'" text-anchor="end" font-size="11" fill="#97979C">'+v+'</text>';
    }
    // 图例改为 SVG 外独立 HTML 行，彻底避免与坐标轴/标签重叠
    var legend='<div style="display:flex;gap:18px;justify-content:center;margin-top:6px;font-size:12px;color:#56565B"><span><i style="display:inline-block;width:10px;height:10px;border-radius:50%;background:#B6C2CF;margin-right:5px;vertical-align:middle"></i>官方号</span><span><i style="display:inline-block;width:10px;height:10px;border-radius:50%;background:#97979C;margin-right:5px;vertical-align:middle"></i>自营号</span><span><i style="display:inline-block;width:10px;height:10px;border-radius:50%;background:#8C99A8;margin-right:5px;vertical-align:middle"></i>兼职号</span></div>';
    return '<div class="card"><h3 style="margin:0 0 12px 0;font-size:14px">📈 本月度各号导引流趋势（按周）</h3>'+
      '<svg viewBox="0 0 '+W+' '+H+'" style="width:100%;height:auto;display:block">'+yGrid+yLabels+
      lines+dots+xLabels+'</svg>'+legend+'</div>';
  }
  // 三类对比柱状图
  function renderTrafficBarChart(sc){
    var W=420,H=300,pad={t:40,r:28,b:88,l:28};
    var iw=W-pad.l-pad.r,ih=H-pad.t-pad.b;
    var bars=[
      {label:'官方号',val:sc.off.join,color:'#B6C2CF'},
      {label:'自营号',val:sc.self.join,color:'#97979C'},
      {label:'兼职号',val:sc.pt.join,color:'#8C99A8'}
    ];
    var maxV=Math.max(5,Math.max.apply(null,bars.map(function(b){return b.val;})));
    var bw=iw/bars.length*0.5,gap=iw/bars.length;
    var rects=bars.map(function(b,i){
      var bh=b.val/maxV*ih,x=pad.l+gap*i+(gap-bw)/2,y=pad.t+ih-bh;
      return '<rect x="'+x+'" y="'+y+'" width="'+bw+'" height="'+bh+'" rx="4" fill="'+b.color+'"/>'+
        '<text x="'+(x+bw/2)+'" y="'+(y-7)+'" text-anchor="middle" font-size="15" font-weight="600" fill="#56565B">'+b.val+'</text>'+
        '<text x="'+(x+bw/2)+'" y="'+(H-pad.b+24)+'" text-anchor="middle" font-size="12" fill="#56565B">'+b.label+'</text>';
    }).join('');
    // 底部统计行（SVG 外独立 div，避免与柱底分类标签重叠）
    var ptTotal=sc.pt.join;
    var mKey=APP.state.tfMonth;
    var isAll=(mKey==='all');
    var mLabel=isAll?'全部':(mKey.substring(0,4)+'年'+Number(mKey.substring(5))+'月');
    var footer='<div style="display:flex;justify-content:flex-end;font-size:12px;color:#97979C;margin-top:10px;padding:0 4px"><span>统计月份　<b style="color:#56565B">'+mLabel+'</b></span></div>';
    return '<div class="card"><h3 style="margin:0 0 12px 0;font-size:14px">📊 本月度三类引流对比</h3>'+
      '<svg viewBox="0 0 '+W+' '+H+'" style="width:100%;height:auto;display:block">'+rects+'</svg>'+footer+'</div>';
  }

    // 明细筛选：月度（日历月份）→ 周（级联该月各周）→ 账号（monthFiltered 已在函数开头定义）

    inactiveAccs.forEach(function(a){aOpts+='<option value="'+a.id+'"'+(APP.state.tfAcc===a.id?' selected':'')+'>'+esc(a.name)+' (停更)</option>';});
    // 明细表排序：官方号→恒白→ddy11→青椒→开心章鱼小丸子→其他（按文档顺序）
    // 官方号和恒白行视觉区分（加粗左边框+浅底色），账号选择器不区分
    var accPriority={'acc_off':1,'acc_hengbai':2,'acc_ddy':3,'acc_qing':4,'acc_wanzi':5};

    var table='<div class="card"><div class="row mb" style="justify-content:space-between"><h3 style="margin:0">'+I.traffic+'引流明细</h3>'+
      '<div class="row" style="gap:8px"><button class="btn sm danger ghost" data-act="trafficClear">清空全部</button>'+

      '<div class="small muted mt">计分规则：官方号按「加好友」、自营号 / 兼职号按「进群」计算引流数，分数 = 引流数 × 该账号在「账号管理」处设置的倍率。不统计报班转化率。</div></div>';
    return head+periodInfo+renderHeat()+charts+table;

      stat('转私域转化率','ok',rateAll+'%','加好友/总人数')+
      '</div>';
    // 群清单：按群号从大到小排列（大号在上）；格式：27 59群 [负责人标签] 加好友/总人数
    var gNum=function(name){var m=String(name||'').match(/(\d+)\D*$/);return m?parseInt(m[1],10):0;};

    else if(c==='xi')sortedGs=sortedGs.filter(function(g){var n=gNum(g.name);return n>0&&n%2===0;}); // 偶数群号→宇天希哥
    sortedGs=sortedGs.sort(function(a,b){return gNum(b.name)-gNum(a.name);});

      '<button class="btn sm" data-act="groupAdd">'+I.plus+'加群</button></div></div>'+
      '<div class="list">'+(sortedGs.length?sortedGs.map(function(g){
        var gn=gNum(g.name);

        var af=Number(g.addFriend)||0;

        var ownerTag=isEven?'<span class="tag parttime">宇天希哥</span>':'<span class="tag self">宇天派哥</span>';
        return '<div class="li"><div class="body"><div class="t">'+esc(g.name)+' '+ownerTag+'</div>'+

  function fmtSize(b){b=Number(b)||0;if(b<1024)return b+' B';if(b<1048576)return (b/1024).toFixed(1)+' KB';return (b/1048576).toFixed(2)+' MB';}
  // 读取上传文件→base64 存入 APP.data.files（带容量守卫，超出 localStorage 时提示并跳过）
  function handleFiles(fileList){
    APP.data.files=APP.data.files||[];
    var maxOne=2*1048576, done=0, skipped=0;
    Array.prototype.forEach.call(fileList,function(f){
      if(f.size>maxOne){skipped++;return;}
      var rd=new FileReader();
      rd.onload=function(){
        APP.data.files.unshift({id:uid(),name:f.name,type:f.type||'文件',size:f.size,data:rd.result,addedAt:today()});
        done++;
        try{save();}catch(e){APP.data.files.shift();toast('存储空间不足，已跳过：'+f.name);}
        if(done+skipped>=fileList.length){
          var v=$('#view');if(v&&APP.state.view==='materials'){v.innerHTML=viewMaterials();bindView();}
          toast('已上传 '+done+' 个文件'+(skipped?('，'+skipped+' 个超限跳过'):''));
        }
      };
      rd.readAsDataURL(f);
    });
    if(skipped&&fileList.length===skipped)toast(skipped+' 个文件超过 2MB，已跳过');
  }

  /* ---------- 图表（内联SVG） ---------- */
  function lineChart(labels,series){
    if(!labels.length)return '<div class="empty">暂无周数据</div>';
    var W=520,H=200,pad=30,max=0;
    series.forEach(function(s){s.vals.forEach(function(v){if(v>max)max=v;});});
    if(max===0)max=1;
    var n=labels.length,bw=(W-pad*2)/(n-1||1);
    function X(i){return pad+bw*i;}
    function Y(v){return H-pad-(v/max)*(H-pad*2);}
    var paths=series.map(function(s){
      var d=s.vals.map(function(v,i){return (i?'L':'M')+X(i).toFixed(1)+' '+Y(v).toFixed(1);}).join(' ');
      var dots=s.vals.map(function(v,i){return '<circle cx="'+X(i).toFixed(1)+'" cy="'+Y(v).toFixed(1)+'" r="3" fill="'+s.color+'"/>';}).join('');
      return '<path d="'+d+'" fill="none" stroke="'+s.color+'" stroke-width="2"/>'+dots;
    }).join('');
    var xlabels=labels.map(function(l,i){return '<text x="'+X(i).toFixed(1)+'" y="'+(H-8)+'" font-size="10" fill="#97979C" text-anchor="middle">'+esc(l)+'</text>';}).join('');
    var legend=series.map(function(s){return '<span style="display:inline-flex;align-items:center;gap:4px;margin-right:10px;font-size:11px;color:#97979C"><i style="width:10px;height:10px;border-radius:3px;background:'+s.color+';display:inline-block"></i>'+esc(s.name)+'</span>';}).join('');
    return '<svg viewBox="0 0 '+W+' '+H+'" width="100%" style="max-height:220px">'+paths+xlabels+'</svg><div style="margin-top:4px">'+legend+'</div>';
  }
  function barChart(labels,vals,colors){
    if(!vals.length)return '<div class="empty">暂无数据</div>';
    var W=520,H=200,pad=30,max=Math.max.apply(null,vals.concat([1]));
    var n=labels.length,bw=(W-pad*2)/n*0.6,gap=(W-pad*2)/n;
    function Y(v){return H-pad-(v/max)*(H-pad*2);}
    var bars=labels.map(function(l,i){
      var x=pad+gap*i+(gap-bw)/2,h=H-pad-Y(vals[i]);
      return '<rect x="'+x.toFixed(1)+'" y="'+Y(vals[i]).toFixed(1)+'" width="'+bw.toFixed(1)+'" height="'+h.toFixed(1)+'" rx="4" fill="'+colors[i]+'"/>'+
        '<text x="'+(x+bw/2).toFixed(1)+'" y="'+(Y(vals[i])-6).toFixed(1)+'" font-size="11" fill="#56565B" text-anchor="middle" font-weight="700">'+vals[i]+'</text>'+
        '<text x="'+(x+bw/2).toFixed(1)+'" y="'+(H-8)+'" font-size="10" fill="#97979C" text-anchor="middle">'+esc(l)+'</text>';
    }).join('');
    return '<svg viewBox="0 0 '+W+' '+H+'" width="100%" style="max-height:220px">'+bars+'</svg>';
  }

  function trafficForm(rec){

    // 解析已有记录的起止日期（兼容旧数据 "8.5" 与完整日期）

      var cyc=String(rec.cycle||'');
      var ms=cyc.match(/(\d{1,2})\.(\d{1,2})/g);

    // 账号列表：活跃排前，停用置后并标注

    var rows=sortedAccs.map(function(a){

      field('起始日期','<input type="date" id="tr_start" value="'+esc(startISO)+'">')+

    var pr=document.getElementById('pubRange'),ps=document.getElementById('pubSort');
    if(pr)pr.addEventListener('change',function(){APP.state.pubRange=this.value;var v=document.getElementById('view');v.innerHTML=viewContent();bindView();});
    if(ps)ps.addEventListener('change',function(){APP.state.pubSort=this.value;var v=document.getElementById('view');v.innerHTML=viewContent();bindView();});
  }
  function onViewClick(e){
    var el=e.target.closest('[data-act],[data-nav],[data-sub],[data-go],[data-stage],[data-audience],[data-heat],[data-mfilter],[data-accfilter],[data-x]');
    if(!el)return;
    if(el.hasAttribute('data-x')){closeModal();return;}
    if(el.hasAttribute('data-nav')){navigate(el.getAttribute('data-nav'));return;}
    if(el.hasAttribute('data-sub')){APP.state.sub=el.getAttribute('data-sub');var v=$('#view');v.innerHTML=viewContent();bindView();
      $('#pageTitle').textContent='内容生产 · '+({topics:'选题库',drafts:'写稿进度',publishes:'发布追踪',reviews:'爆款复盘'}[APP.state.sub]);return;}
    if(el.hasAttribute('data-go')){navigate(el.getAttribute('data-go'));return;}
    if(el.hasAttribute('data-stage')){APP.state.topicStage=el.getAttribute('data-stage');var vs=$('#view');if(vs){vs.innerHTML=viewContent();bindView();}$('#pageTitle').textContent='内容生产 · 选题库';return;}
    if(el.hasAttribute('data-audience')){APP.state.topicAudience=el.getAttribute('data-audience');var va=$('#view');if(va){va.innerHTML=viewContent();bindView();}$('#pageTitle').textContent='内容生产 · 选题库';return;}
    if(el.hasAttribute('data-heat')){APP.state.heatRange=el.getAttribute('data-heat');var vh=$('#view');if(vh){vh.innerHTML=viewTraffic();bindView();}return;}
    if(el.hasAttribute('data-mfilter')){APP.state.matType=el.getAttribute('data-mfilter');var vm=$('#view');if(vm){vm.innerHTML=viewMaterials();bindView();}return;}
    if(el.hasAttribute('data-accfilter')){APP.state.accTypeFilter=el.getAttribute('data-accfilter');var va=$('#view');if(va){va.innerHTML=viewAccounts();bindView();}return;}
    var act=el.getAttribute('data-act'),id=el.getAttribute('data-id')||'';
    handleAct(act,id,el);
  }
  function find(arr,id){return arr.filter(function(x){return x.id===id;})[0];}
  function handleAct(act,id,el){
    switch(act){
      case 'topicAdd':topicForm();break;
      case 'topicAutoNow':{var r=topicAutoRelease(true);toast(r.added>0?('已补充 '+r.added+' 条选题'):(r.done?'选题池已用完':'暂未到更新时间'));var vx=$('#view');if(vx){vx.innerHTML=viewContent();bindView();}break;}
      case 'topicEdit':topicForm(find(APP.data.topics,id));break;
      case 'topicDel':if(confirm('确认删除该选题？')){APP.data.topics=APP.data.topics.filter(function(x){return x.id!==id;});save();render();toast('已删除');}break;
      case 'topicStatus':{var t=find(APP.data.topics,id);var order=['idea','writing','review','published'];var i=order.indexOf(t.status);var nx=order[(i+1)%4];t.status=nx;save();render();toast('状态→'+statusText(nx));}break;
      case 'topicSave':{
        var t=id?find(APP.data.topics,id):{id:uid(),createdAt:today()};
        t.title=$('#tf_title').value;t.angle=$('#tf_angle').value;t.subject=$('#tf_subj').value;
        t.stage=$('#tf_stage').value;t.pain=$('#tf_pain').value;t.forAccount=$('#tf_acc').value;
        t.status=$('#tf_status').value;t.audience=$('#tf_aud').value;t.note=$('#tf_note').value;
        if(!id)APP.data.topics.unshift(t);save();closeModal();render();toast('已保存');break;}
      case 'draftAdd':draftForm();break;
      case 'draftEdit':draftForm(find(APP.data.drafts,id));break;
      case 'draftDel':if(confirm('确认删除？')){APP.data.drafts=APP.data.drafts.filter(function(x){return x.id!==id;});save();render();toast('已删除');}break;
      case 'draftSave':{
        var d=id?find(APP.data.drafts,id):{id:uid()};
        d.title=$('#dk_title').value;d.topicId=$('#dk_topic').value;d.owner=$('#dk_owner').value;
        d.due=$('#dk_due').value;d.status=$('#dk_st').value;d.link=$('#dk_link').value;
        if(!id)APP.data.drafts.unshift(d);save();closeModal();render();toast('已保存');break;}
      case 'pubAdd':pubForm();break;
      case 'pubEdit':pubForm(find(APP.data.publishes,id));break;
      case 'pubDel':if(confirm('确认删除？')){APP.data.publishes=APP.data.publishes.filter(function(x){return x.id!==id;});APP.data.reviews=APP.data.reviews.filter(function(x){return !(x.publishId===id && x.source==='auto');});save();render();toast('已删除');}break;
      case 'copyLink':copyText(el.getAttribute('data-text'));break;
      case 'pubHotToggle':APP.state.pubHot=!APP.state.pubHot;var vh=$('#view');if(vh){vh.innerHTML=viewContent();bindView();}break;
      case 'pubHighViewToggle':APP.state.pubHighView=!APP.state.pubHighView;var vh2=$('#view');if(vh2){vh2.innerHTML=viewContent();bindView();}break;
      case 'pubExport':{
        var rows=pubList();
        var header=['发布日期','账号','标题','浏览量','点赞量','收藏量','评论量','类型标注'];
        var lines=[header.map(csvCell).join(',')];
        rows.forEach(function(p){
          var st=pubStats(p);
          var type=(isHotPost(p)&&!isHighViewPost(p))?'爆款':(isHighViewPost(p)?'高浏览':'普通');
          var viewVal=st.isPT?'':st.view;
          lines.push([p.date||'',accName(p.account)||'',p.title||'',viewVal,st.like,st.fav,st.comment,type].map(csvCell).join(','));
        });
        var namePart=(APP.state.pubHot?'_爆款':(APP.state.pubHighView?'_高浏览':(APP.state.pubRange!=='all'?('_'+APP.state.pubRange.replace('-','年')+'月'):'')));
        var blob=new Blob(['﻿'+lines.join('\r\n')],{type:'text/csv;charset=utf-8;'});
        var a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='发布数据导出'+namePart+'.csv';document.body.appendChild(a);a.click();URL.revokeObjectURL(a.href);document.body.removeChild(a);
        toast('已导出 '+rows.length+' 条');break;}
      case 'pubSave':{
        var p=id?find(APP.data.publishes,id):{id:uid()};
        p.title=$('#pb_title').value;p.date=$('#pb_date').value;p.account=$('#pb_acc').value;p.link=$('#pb_link').value;
        p.view=parseCount($('#pb_view').value);p.like=parseCount($('#pb_like').value);p.fav=parseCount($('#pb_fav').value);p.comment=parseCount($('#pb_comment').value);p.statTime=$('#pb_statTime').value;
        if(!id)APP.data.publishes.unshift(p);
        syncReviewFromPublish(p);
        save();closeModal();render();toast('已保存');break;}
      case 'revAdd':revForm();break;
      case 'revEdit':revForm(find(APP.data.reviews,id));break;
      case 'revDel':if(confirm('确认删除该复盘？')){APP.data.reviews=APP.data.reviews.filter(function(x){return x.id!==id;});save();render();toast('已删除');}break;
      case 'revSave':{
        var r=id?find(APP.data.reviews,id):{id:uid(),publishId:''};
        r.title=$('#rv_title').value;r.date=$('#rv_date').value;
        r.expose=parseCount($('#rv_expose').value);r.interact=parseCount($('#rv_interact').value);r.join=parseCount($('#rv_join').value);r.note=$('#rv_note').value;
        if(!id)APP.data.reviews.unshift(r);save();closeModal();render();toast('已保存');break;}
      case 'trafficAdd':trafficForm();break;
      case 'trafficEdit':trafficForm(find(APP.data.traffic,id));break;
      case 'trafficDel':if(confirm('确认删除该条统计？')){APP.data.traffic=APP.data.traffic.filter(function(x){return x.id!==id;});save();render();toast('已删除');}break;
      case 'trafficClear':if(confirm('确认清空全部引流数据？此操作不可撤销')){APP.data.traffic=[];save();render();toast('已清空引流数据');}break;
      case 'trafficSave':{
        var startISO=$('#tr_start').value, endISO=$('#tr_end').value||$('#tr_start').value;
        if(!startISO){toast('请选择起始日期');break;}
        var cycle=formatMD(startISO)+(endISO&&endISO!==startISO?(' - '+formatMD(endISO)):'');
        var cstart=startISO, pid=pidOf(cstart), note=$('#tr_note').value;
        // 编辑单条：直接更新该账号记录
        if(id){
          var r=find(APP.data.traffic,id);
          if(r){var ra=accById(r.accountId),off=ra&&ra.type==='official';var v=Number($('#tr_num_'+r.accountId).value)||0;
            if(off){r.addFriend=v;r.join=0;}else{r.join=v;r.addFriend=0;}
            r.cycle=cycle;r.cstart=cstart;r.periodId=pid;r.note=note;}
          save();closeModal();render();toast('已保存');break;
        }
        // 新增：按账号批量写入，仅处理填了数字的账号（同账号同周期自动更新，不重复）
        var n=0;
        APP.data.accounts.forEach(function(a){
          var el=$('#tr_num_'+a.id);if(!el)return;var v=Number(el.value)||0;if(v<=0)return;
          var off=a.type==='official';
          var ex=APP.data.traffic.filter(function(r){return r.accountId===a.id&&r.cycle===cycle;})[0];
          if(ex){if(off){ex.addFriend=v;ex.join=0;}else{ex.join=v;ex.addFriend=0;}ex.cstart=cstart;ex.periodId=pid;ex.note=note;}
          else APP.data.traffic.unshift({id:uid(),periodId:pid,cycle:cycle,cstart:cstart,accountId:a.id,join:off?0:v,addFriend:off?v:0,note:note});
          n++;
        });
        if(!n){toast('请至少填写一个账号数字');break;}
        save();closeModal();render();toast('已保存 '+n+' 条');break;}
      case 'periodEdit':periodForm();break;
      case 'periodSave':{var p=APP.data.periods.filter(function(x){return x.id===id;})[0];
        if(p){p.start=$('#pe_start').value;p.end=$('#pe_end').value;save();closeModal();render();toast('月度边界已更新');}break;}
      case 'groupAdd':groupForm();break;
      case 'groupEdit':groupForm(find(APP.data.groups,id));break;
      case 'groupDel':if(confirm('确认删除该群？')){APP.data.groups=APP.data.groups.filter(function(x){return x.id!==id;});save();render();toast('已删除');}break;
      case 'groupSave':{
        var g=id?find(APP.data.groups,id):{id:uid()};
        g.name=$('#gr_name').value;g.member=Number($('#gr_mem').value)||0;g.owner=$('#gr_owner').value;
        g.addFriend=Number($('#gr_add').value)||0;g.note=$('#gr_note').value;g.cat=$('#gr_cat').value||'27考研';g.convertOwner=convertOwnerOf(g.name);
        if(!id)APP.data.groups.unshift(g);save();closeModal();render();toast('已保存');break;}
      case 'accAdd':accForm();break;
      case 'accEdit':accForm(find(APP.data.accounts,id));break;
      case 'accDel':if(confirm('确认删除该账号档案？')){APP.data.accounts=APP.data.accounts.filter(function(x){return x.id!==id;});save();render();toast('已删除');}break;
      case 'accSave':{
        var a=id?find(APP.data.accounts,id):{id:uid()};
        a.name=$('#ac_name').value;
        var tv=$('#ac_type').value;
        if(tv==='official'){a.type='official';a.cat='官方号';}
        else if(tv==='self'){a.type='self';a.cat='自营号';}
        else if(tv==='pt'){a.type='parttime';a.cat='兼职号';}
        else {a.type='parttime';a.cat='兼职号';}
        a.holder=$('#ac_holder').value;a.owner=$('#ac_owner').value;
        a.rate=Number($('#ac_rate').value)||1;a.active=$('#ac_active').value==='1';
        a.persona=$('#ac_persona').value;a.note=$('#ac_note').value;
        if(!id)APP.data.accounts.unshift(a);save();closeModal();render();toast('已保存');break;}
      case 'matAdd':matForm();break;
      case 'matEdit':matForm(find(APP.data.materials,id));break;
      case 'matDel':if(confirm('确认删除该资料？')){APP.data.materials=APP.data.materials.filter(function(x){return x.id!==id;});save();render();toast('已删除');}break;
      case 'matSave':{
        var m=id?find(APP.data.materials,id):{id:uid()};
        m.name=$('#mt_name').value;m.type=$('#mt_type').value;m.audience=$('#mt_aud').value;
        m.status=$('#mt_st').value;m.version=$('#mt_ver').value;m.obtain=$('#mt_obt').value;m.intro=$('#mt_intro').value;
        if(!id)APP.data.materials.unshift(m);save();closeModal();render();toast('已保存');break;}
      case 'qaAdd':qaForm();break;
      case 'qaEdit':qaForm(find(APP.data.qa,id));break;
      case 'qaDel':if(confirm('确认删除？')){APP.data.qa=APP.data.qa.filter(function(x){return x.id!==id;});save();render();toast('已删除');}break;
      case 'qaSave':{
        var q=id?find(APP.data.qa,id):{id:uid()};
        q.question=$('#qa_q').value;q.answer=$('#qa_a').value;q.importance=$('#qa_imp').value;
        q.sourceGroup=$('#qa_src').value;q.tags=$('#qa_tag').value;
        if(!id)APP.data.qa.unshift(q);save();closeModal();render();toast('已保存');break;}
      case 'filePick':{var fi=$('#matFile');if(fi)fi.click();break;}
      case 'fileDown':{var fo=find(APP.data.files||[],id);if(!fo)break;
        var al=document.createElement('a');al.href=fo.data;al.download=fo.name;al.click();toast('已下载：'+fo.name);break;}
      case 'fileDel':if(confirm('确认删除该文件？')){APP.data.files=(APP.data.files||[]).filter(function(x){return x.id!==id;});save();var vf=$('#view');if(vf){vf.innerHTML=viewMaterials();bindView();}toast('已删除');}break;
      case 'export':exportJSON();break;
      case 'import':$('#importFile').click();break;
      case 'reset':resetData();break;
    }
  }
  function exportJSON(){
    var blob=new Blob([JSON.stringify(APP.data,null,2)],{type:'application/json'});
    var a=document.createElement('a');a.href=URL.createObjectURL(blob);
    a.download='yutian_ops_backup_'+today()+'.json';a.click();toast('已导出备份');
  }
  function resetData(){
    if(confirm('确认清空所有数据并恢复预置示例？此操作不可撤销。')){
      APP.data=seed();save();render();toast('已恢复示例数据');
    }
  }
  /* ---------- 初始化 ---------- */
  function init(){
    APP.data=load();
    // 品牌副标题：guest 模式去掉"小艺"，自己链接保持不变
    var bs=document.getElementById('brandSub');
    if(bs)bs.textContent=IS_GUEST?'运营工作台':'运营工作台 · 小艺';
    // 选题库每周自动补充（打开即检查：距上次≥7天则从储备池放出3条）；主链接与 guest 链接一致
    try{var _rel=topicAutoRelease(false);if(_rel.added>0&&$('#toast'))toast('本周已自动补充 '+_rel.added+' 条选题');}catch(e){}

    // 绑定导航
    $('#menu').addEventListener('click',function(e){var n=e.target.closest('[data-nav]');if(n)navigate(n.getAttribute('data-nav'));});
    $('#bottombar').addEventListener('click',function(e){var n=e.target.closest('[data-nav]');if(n)navigate(n.getAttribute('data-nav'));});
    $('#ham').addEventListener('click',function(){$('#nav').classList.add('show');$('#scrim').classList.add('show');});
    $('#scrim').addEventListener('click',closeNav);
    $('#mask').addEventListener('click',function(e){if(e.target.id==='mask')closeModal();});
    document.getElementById('view').addEventListener('click',onViewClick);
    document.getElementById('mask').addEventListener('click',onViewClick);
    // 导入 + 月度/周/账号筛选 + 资料文件上传
    document.addEventListener('change',function(e){
      var t=e.target;if(!t)return;
      if(t.id==='importFile'){var f=t.files[0];if(!f)return;
        var rd=new FileReader();rd.onload=function(){try{var d=JSON.parse(rd.result);if(d&&d.accounts){APP.data=d;save();render();toast('导入成功');}else toast('文件格式不正确');}catch(err){toast('解析失败');}};
        rd.readAsText(f);}
      if(t.id==='tfPeriod'){APP.state.tfPeriod = t.value; var vf=$('#view');if(vf){vf.innerHTML=viewTraffic();bindView();}}
      if(t.id==='tfMonth'){APP.state.tfMonth=t.value; APP.state.tfPeriod=''; var vm=$('#view');if(vm){vm.innerHTML=viewTraffic();bindView();}}
      if(t.id==='tfMonth2'){APP.state.tfMonth=t.value; APP.state.tfPeriod=''; var vm=$('#view');if(vm){vm.innerHTML=viewTraffic();bindView();}}
      if(t.id==='tfAcc'){APP.state.tfAcc=t.value; var va=$('#view');if(va){va.innerHTML=viewTraffic();bindView();}}
      if(t.id==='privYear'){APP.state.privYear=t.value; var vpy=$('#view');if(vpy){vpy.innerHTML=viewPrivate();bindView();}}
      if(t.id==='privConsult'){APP.state.privConsult=t.value; var vpc=$('#view');if(vpc){vpc.innerHTML=viewPrivate();bindView();}}
      if(t.id==='matFile'){var fl=t.files;if(!fl||!fl.length)return;handleFiles(fl);t.value='';}
    });
    renderNav();
    APP.state.tfMonth=currentMonthKey();
    var cpid=currentMonthPid();var cp=APP.data.periods.filter(function(x){return x.id===cpid;})[0];
    $('#periodPill').textContent='本月度 '+(cp?(cp.start+'~'+cp.end):'-');
    navigate('dashboard');
  }
  init();
})();
</script>
